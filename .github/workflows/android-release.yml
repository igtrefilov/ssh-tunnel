name: Android release

on:
  push:
    tags:
      - "android-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: android-release
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.14206865"

      - name: Restore signing identity
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          TUNNEL_PRIVATE_KEY_BASE64: ${{ secrets.ANDROID_TUNNEL_PRIVATE_KEY_BASE64 }}
        run: |
          install -d -m 0700 clients/android/keys
          install -d -m 0700 clients/android/app/src/main/assets-bundled
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > clients/android/keys/ssh-tunnel-release.p12
          printf '%s' "$RELEASE_KEYSTORE_PASSWORD" > clients/android/keys/ssh-tunnel-release.pass
          printf '%s' "$TUNNEL_PRIVATE_KEY_BASE64" | base64 --decode > clients/android/app/src/main/assets-bundled/ssh_tunnel_key
          chmod 0600 clients/android/keys/ssh-tunnel-release.p12 clients/android/keys/ssh-tunnel-release.pass
          chmod 0600 clients/android/app/src/main/assets-bundled/ssh_tunnel_key

      - name: Build and sign APK
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
        run: clients/android/scripts/sign-release.sh

      - name: Prepare release assets
        run: |
          apk=$(find clients/android/app/build/outputs/apk/release -name '*-release-signed.apk' -print -quit)
          test -n "$apk"
          version=$(sed -n 's/.*"versionName"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' \
            clients/android/app/build/outputs/apk/release/output-metadata.json | head -1)
          version_code=$(sed -n 's/.*"versionCode"[[:space:]]*:[[:space:]]*\([0-9][0-9]*\).*/\1/p' \
            clients/android/app/build/outputs/apk/release/output-metadata.json | head -1)
          test "$GITHUB_REF_NAME" = "android-v$version"
          test -n "$version_code"
          sha256sum "$apk" > "${apk}.sha256"
          checksum=$(awk '{print $1}' "${apk}.sha256")
          apk_name=$(basename "$apk")
          cat > clients/android/app/build/outputs/apk/release/update.json <<EOF
          {
            "versionCode": $version_code,
            "versionName": "$version",
            "tagName": "$GITHUB_REF_NAME",
            "apkName": "$apk_name",
            "sha256": "$checksum"
          }
          EOF
          printf 'APK_PATH=%s\n' "$apk" >> "$GITHUB_ENV"
          printf 'UPDATE_PATH=%s\n' "clients/android/app/build/outputs/apk/release/update.json" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$APK_PATH" "${APK_PATH}.sha256" \
            "$UPDATE_PATH" \
            --verify-tag \
            --generate-notes \
            --title "Android ${GITHUB_REF_NAME#android-v}"

plugins {
    id "com.android.application"
}

android {
    namespace "net.tref.sshtunnel"
    compileSdk 35
    ndkVersion "29.0.14206865"

    buildFeatures { buildConfig true }

    sourceSets {
        main {
            assets.srcDirs = ["src/main/assets-public", "src/main/assets-bundled"]
        }
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId "net.tref.xraytunnel"
        minSdk 23
        targetSdk 35
        versionCode 35
        versionName "1.34"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            ndkBuild {
                arguments "APP_LDFLAGS+=-Wl,--build-id=none"
            }
        }
    }

    packaging {
        resources {
            excludes += ["META-INF/versions/**", "META-INF/OSGI-INF/**"]
        }
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test:runner:1.6.2"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    implementation "com.github.mwiede:jsch:0.2.25"
    implementation "androidx.core:core:1.15.0"
    // JSch uses its Bouncy Castle adapters for Ed25519 on Android runtimes.
    // The gateway advertises an Ed25519 host key, so keep this provider in the
    // APK instead of relying on a desktop JVM's optional crypto support.
    implementation "org.bouncycastle:bcprov-jdk18on:1.79"
}

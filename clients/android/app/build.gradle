plugins {
    id "com.android.application"
}

android {
    namespace "net.tref.xraytunnel"
    compileSdk 35
    ndkVersion "29.0.14206865"

    sourceSets {
        main {
            assets.srcDirs = ["src/main/assets-public", "src/main/assets-bundled"]
        }
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId "net.tref.xraytunnel"
        minSdk 23
        targetSdk 35
        versionCode 30
        versionName "1.29"
        externalNativeBuild {
            ndkBuild {
                arguments "APP_CFLAGS+=-DPKGNAME=net/tref/xraytunnel -DCLSNAME=TunnelService"
                arguments "APP_LDFLAGS+=-Wl,--build-id=none"
            }
        }
    }

    packaging {
        resources {
            excludes += ["META-INF/versions/**", "META-INF/OSGI-INF/**"]
        }
    }
}

dependencies {
    implementation "com.github.mwiede:jsch:0.2.25"
    // JSch uses its Bouncy Castle adapters for Ed25519 on Android runtimes.
    // The gateway advertises an Ed25519 host key, so keep this provider in the
    // APK instead of relying on a desktop JVM's optional crypto support.
    implementation "org.bouncycastle:bcprov-jdk18on:1.79"
}
